<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#f4f8ff;color:#16345c;font-family:Arial,Helvetica,sans-serif;}
#topBar{position:sticky;top:0;z-index:9999;display:flex;align-items:center;gap:8px;padding:9px;background:linear-gradient(135deg,#0d47a1,#1976d2);color:#fff;box-shadow:0 3px 12px rgba(13,71,161,.25);}
#topBar button{border:0;border-radius:7px;padding:9px 13px;background:#eaf2ff;color:#124a91;font-weight:bold;cursor:pointer;}
#topBar button:disabled{opacity:.35;cursor:not-allowed;}
#topBar .naslov{flex:1;text-align:center;font-weight:bold;}
#topBar .strana{font-size:13px;white-space:nowrap;}
#snimi{background:#00a389!important;color:#fff!important;}
#sadrzaj{max-width:1400px;margin:0 auto;padding:30px;background:#fff;min-height:calc(100vh - 55px);}
.naslovna{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.naslovna img{width:900px;height:900px;max-width:90%;max-height:65vh;object-fit:contain;}
.naslovna h1{margin-top:20px;font-size:42px;}
.mreza{display:grid;grid-template-columns:repeat(4,1fr);gap:25px;}
.proizvod{text-align:center;}
.brojNaSlici{position:absolute;z-index:5;right:8px;bottom:8px;display:block;width:70px;height:44px;margin:0;padding:5px 8px;border:2px solid #1565c0;border-radius:8px;background:rgba(255,255,255,.92);color:#16345c;text-align:center;font-size:22px;font-weight:bold;line-height:30px;outline:none;box-shadow:0 2px 8px rgba(13,71,161,.18);}
.brojNaSlici:focus{border-color:#0d47a1;box-shadow:0 0 0 3px rgba(21,101,192,.18);}
.slikaBox{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f4f8ff;border:1px solid #dbe8fb;border-radius:12px;cursor:pointer;position:relative;}
.slika{width:100%;height:100%;object-fit:contain;opacity:1;transition:opacity .2s ease;}
.slika.poluprovidna{opacity:.5;}
.ime{margin-top:10px;font-size:16px;font-weight:bold;}
#navigacija{display:flex;justify-content:center;gap:15px;padding:25px;}
#navigacija button{min-width:120px;border:0;border-radius:8px;padding:11px 17px;background:#1565c0;color:#fff;font-weight:bold;cursor:pointer;}
#navigacija button:disabled{opacity:.4;cursor:not-allowed;}
@media(max-width:800px){
#sadrzaj{padding:15px;}
.mreza{grid-template-columns:repeat(2,1fr);gap:15px;}
.naslovna h1{font-size:32px;}
.brojNaSlici{width:65px;height:40px;font-size:20px;line-height:26px;}
}
@media(max-width:500px){
#topBar{gap:4px;padding:6px;}
#topBar button{padding:8px 9px;font-size:12px;}
#topBar .strana{display:none;}
.mreza{gap:10px;}
.ime{font-size:13px;}
.brojNaSlici{right:6px;bottom:6px;width:58px;height:36px;font-size:18px;line-height:22px;}
}
#modalOverlay{position:fixed;inset:0;z-index:20000;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px;}
#modalOverlay.prikazi{display:flex;}
.modalBox{width:100%;max-width:460px;background:#fff;border-radius:14px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3);color:#111;}
.modalBox h2{margin:0 0 18px 0;text-align:center;font-size:22px;}
.modalBox p{margin:8px 0 14px;line-height:1.45;}
.modalBox label{display:block;font-weight:bold;margin:10px 0 5px;}
.modalBox input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px;}
.modalButton{width:100%;border:0;border-radius:9px;padding:12px;margin-top:9px;font-size:16px;font-weight:bold;cursor:pointer;}
.modalPrimary{background:#1565c0;color:#fff;}
.modalSecondary{background:#e7f0ff;color:#174a8b;}
.modalClose{background:#d33;color:#fff;}
.emailInfo{text-align:center;margin-top:15px;font-size:14px;color:#555;}
.emailInfo a{color:#1565c0;font-weight:bold;}
.formaRed{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:500px){.formaRed{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="topBar">
<button id="prethodnaGore" type="button">←</button>
<div class="naslov" id="naslovKataloga"></div>
<div class="strana" id="brojStrane"></div>
<button id="sledecaGore" type="button">→</button>
<button id="snimi" type="button">📧 EMAIL</button>
</div>
<div id="modalOverlay">
<div class="modalBox" id="modalIzbor">
<h2>Pošalji narudžbinu emailom</h2>
<p>Narudžbina će biti poslata na alegrokupovina@gmail.com.</p>
<button id="izborXlsx" type="button" class="modalButton modalPrimary">📧 EMAIL POSLATI NA alegrokupovina@gmail.com</button>
<button id="zatvoriIzbor" type="button" class="modalButton modalSecondary">Otkaži</button>
</div>
<div class="modalBox" id="modalForma" style="display:none">
<h2>Podaci kupca</h2>
<div class="formaRed">
<div><label for="kupacIme">Ime</label><input id="kupacIme" type="text" autocomplete="given-name"></div>
<div><label for="kupacPrezime">Prezime</label><input id="kupacPrezime" type="text" autocomplete="family-name"></div>
</div>
<label for="kupacFirma">Naziv firme</label>
<input id="kupacFirma" type="text" autocomplete="organization">
<label for="kupacAdresa">Adresa</label>
<input id="kupacAdresa" type="text" autocomplete="street-address">
<label for="kupacEmail">Email adresa</label>
<input id="kupacEmail" type="email" autocomplete="email">
<div class="emailInfo">email poslati na <a href="#" id="emailSlanjeLink">alegrokupovina@gmail.com</a></div>
<button id="potvrdiXlsx" type="button" class="modalButton modalPrimary">📧 EMAIL POSLATI</button>
<button id="nazadIzbor" type="button" class="modalButton modalSecondary">Nazad</button>
<button id="zatvoriFormu" type="button" class="modalButton modalClose">Otkaži</button>
</div>
</div>
<div id="sadrzaj"></div>
<div id="navigacija">
<button id="prethodna" type="button">← Prethodna</button>
<button id="sledeca" type="button">Sledeća →</button>
</div>

function base64UTekst(base64){
const binary=atob(base64);
const bytes=new Uint8Array(binary.length);
for(let i=0;i<binary.length;i++){bytes[i]=binary.charCodeAt(i);}
return new TextDecoder().decode(bytes);
}

const KLJUC_PODATAKA_KUPCA='pdfKatalogPodaciKupcaV1';
function sacuvajPodatkeKupca(){
try{
localStorage.setItem(KLJUC_PODATAKA_KUPCA,JSON.stringify({ime:kupacIme.value,prezime:kupacPrezime.value,firma:kupacFirma.value,adresa:kupacAdresa.value,email:kupacEmail.value}));
}catch(error){console.warn('Podaci kupca nisu mogli biti sačuvani u ovom pregledaču.',error);}
}
function ucitajPodatkeKupca(){
try{
const sacuvani=JSON.parse(localStorage.getItem(KLJUC_PODATAKA_KUPCA)||'null');
if(!sacuvani)return;
kupacIme.value=sacuvani.ime||'';
kupacPrezime.value=sacuvani.prezime||'';
kupacFirma.value=sacuvani.firma||'';
kupacAdresa.value=sacuvani.adresa||'';
kupacEmail.value=sacuvani.email||'';
}catch(error){console.warn('Sačuvani podaci kupca nisu mogli biti učitani.',error);}
}
ucitajPodatkeKupca();
[kupacIme,kupacPrezime,kupacFirma,kupacAdresa,kupacEmail].forEach(function(polje){
polje.addEventListener('input',sacuvajPodatkeKupca);
polje.addEventListener('change',sacuvajPodatkeKupca);
});
naslovKataloga.textContent=KATALOG_PODACI.title||'Moj katalog';
function ukupanBrojStrana(){
const proizvodi=KATALOG_PODACI.products||[];
return 1+Math.ceil(proizvodi.length/PO_STRANI);
}
function prikazi(){
sadrzaj.innerHTML='';
const proizvodi=KATALOG_PODACI.products||[];
const ukupno=ukupanBrojStrana();
brojStrane.textContent=(trenutnaStrana+1)+' / '+ukupno;
if(trenutnaStrana===0){
const cover=document.createElement('div');
cover.className='naslovna';
if(KATALOG_PODACI.cover){
const img=document.createElement('img');
img.src=KATALOG_PODACI.cover;
cover.appendChild(img);
}
const h1=document.createElement('h1');
h1.textContent=KATALOG_PODACI.title||'Moj katalog';
cover.appendChild(h1);
sadrzaj.appendChild(cover);
}
else{
const start=(trenutnaStrana-1)*PO_STRANI;
const kraj=Math.min(start+PO_STRANI,proizvodi.length);
const mreza=document.createElement('div');
mreza.className='mreza';
for(let i=start;i<kraj;i++){
const proizvod=proizvodi[i];
const item=document.createElement('div');
item.className='proizvod';
const broj=document.createElement('input');
broj.type='number';
broj.inputMode='numeric';
broj.pattern='[0-9]*';
broj.enterKeyHint='done';
broj.className='brojNaSlici';
broj.value=proizvod.number||'';
broj.addEventListener('click',function(event){
event.stopPropagation();
});
broj.addEventListener('input',function(){
proizvod.number=broj.value;
});
broj.addEventListener('keydown',function(event){
if(event.key==='Enter'){
event.preventDefault();
proizvod.number=broj.value;
broj.blur();
}
});
const box=document.createElement('div');
box.className='slikaBox';
const img=document.createElement('img');
img.className='slika';
img.src=proizvod.image;
if(proizvod.transparent===true){
img.classList.add('poluprovidna');
}
box.addEventListener('click',function(){
proizvod.transparent=!proizvod.transparent;
img.classList.toggle('poluprovidna',proizvod.transparent);
broj.focus();
if(typeof broj.select==='function'){
broj.select();
}
});
box.appendChild(img);
box.appendChild(broj);
const ime=document.createElement('div');
ime.className='ime';
ime.textContent=proizvod.name||'';
item.appendChild(box);
item.appendChild(ime);
mreza.appendChild(item);
}
sadrzaj.appendChild(mreza);
}
const prva=trenutnaStrana===0;
const poslednja=trenutnaStrana>=ukupno-1;
prethodna.disabled=prva;
prethodnaGore.disabled=prva;
sledeca.disabled=poslednja;
sledecaGore.disabled=poslednja;
}
function idiSledeca(){
if(trenutnaStrana<ukupanBrojStrana()-1){
trenutnaStrana++;
prikazi();
window.scrollTo({top:0,behavior:'smooth'});
}
}
function idiPrethodna(){
if(trenutnaStrana>0){
trenutnaStrana--;
prikazi();
window.scrollTo({top:0,behavior:'smooth'});
}
}
prethodna.addEventListener('click',idiPrethodna);
prethodnaGore.addEventListener('click',idiPrethodna);
sledeca.addEventListener('click',idiSledeca);
sledecaGore.addEventListener('click',idiSledeca);
function napraviImeFajla(text){
return String(text||'katalog')
.replace(/[<>:"/\\|?*]/g,'')
.trim()
.replace(/\s+/g,'-')
.substring(0,100)||'katalog';
}
function napraviXLSX(kupac){
if(typeof XLSX==='undefined'){
alert('Excel biblioteka nije učitana. Proverite internet konekciju i pokušajte ponovo.');
return;
}
const proizvodi=KATALOG_PODACI.products||[];
const redovi=[];
redovi.push(['Podaci naručioca','']);
redovi.push(['Ime',kupac.ime]);
redovi.push(['Prezime',kupac.prezime]);
redovi.push(['Naziv firme',kupac.firma]);
redovi.push(['Adresa',kupac.adresa]);
redovi.push(['Email',kupac.email]);
redovi.push(['Email za slanje','alegrokupovina@gmail.com']);
redovi.push([]);
redovi.push(['Naziv proizvoda','Broj']);
for(let i=0;i<proizvodi.length;i++){
const proizvod=proizvodi[i]||{};
const naziv=String(proizvod.name||'').trim();
const broj=String(proizvod.number||'').trim();
redovi.push([naziv,broj]);
}
const worksheet=XLSX.utils.aoa_to_sheet(redovi);
worksheet['!cols']=[{wch:40},{wch:35}];
const workbook=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(workbook,worksheet,'Narudžbina');
const ime=
napraviImeFajla(KATALOG_PODACI.title||'narudzbina')
+'.xlsx';
XLSX.writeFile(workbook,ime);
}
function otvoriModal(element){
modalIzbor.style.display='none';
modalForma.style.display='none';
element.style.display='block';
modalOverlay.classList.add('prikazi');
}
function zatvoriModal(){
modalOverlay.classList.remove('prikazi');
}
snimi.addEventListener('click',function(){
otvoriModal(modalIzbor);
});
izborXlsx.addEventListener('click',function(){
otvoriModal(modalForma);
kupacIme.focus();
});
zatvoriIzbor.addEventListener('click',zatvoriModal);
zatvoriFormu.addEventListener('click',zatvoriModal);
nazadIzbor.addEventListener('click',function(){
otvoriModal(modalIzbor);
});
modalOverlay.addEventListener('click',function(event){
if(event.target===modalOverlay){
zatvoriModal();
}
});
function posaljiNarudzbinuEmailom(){
const kupac={
ime:kupacIme.value.trim(),
prezime:kupacPrezime.value.trim(),
firma:kupacFirma.value.trim(),
adresa:kupacAdresa.value.trim(),
email:kupacEmail.value.trim()
};
const proizvodi=KATALOG_PODACI.products||[];
const izabrani=proizvodi.filter(function(p){return String(p.number||'').trim()!=='' && Number(p.number)>0;});
if(!izabrani.length){
alert('Unesite količinu na slici najmanje jednog artikla.');
return;
}
if(kupac.email && !kupacEmail.checkValidity()){
alert('Unesite ispravnu email adresu ili ostavite polje prazno.');
kupacEmail.focus();
return;
}
const stavke=izabrani.map(function(p){return '- '+String(p.name||'Artikal')+' — količina: '+String(p.number).trim();}).join('\r\n');
const subject='Narudžbina - '+(kupac.ime+' '+kupac.prezime).trim();
const body='Poštovani,\r\n\r\n'+
'Želim da naručim sledeće artikle:\r\n\r\n'+
stavke+'\r\n\r\n'+
'PODACI KUPCA\r\n'+
(kupac.ime?'Ime: '+kupac.ime+'\r\n':'')+
(kupac.prezime?'Prezime: '+kupac.prezime+'\r\n':'')+
(kupac.firma?'Firma: '+kupac.firma+'\r\n':'')+
(kupac.adresa?'Adresa: '+kupac.adresa+'\r\n':'')+
(kupac.email?'Email: '+kupac.email+'\r\n':'')+
'\r\nHvala.';
const dokument='NARUDŽBINA\r\n==============================\r\n\r\n'+stavke+'\r\n\r\nPODACI KUPCA\r\n==============================\r\n'+
(kupac.ime?'Ime: '+kupac.ime+'\r\n':'')+
(kupac.prezime?'Prezime: '+kupac.prezime+'\r\n':'')+
(kupac.firma?'Firma: '+kupac.firma+'\r\n':'')+
(kupac.adresa?'Adresa: '+kupac.adresa+'\r\n':'')+
(kupac.email?'Email: '+kupac.email+'\r\n':'')+
'\r\nPrimalac narudžbine: alegrokupovina@gmail.com\r\n';
const blob=new Blob(['﻿'+dokument],{type:'text/plain;charset=utf-8'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download='Narudzbina_'+new Date().toISOString().slice(0,10)+'.txt';
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(function(){URL.revokeObjectURL(url);},1500);
zatvoriModal();
alert('Dokument narudžbine je preuzet. Sada ga priložite emailu kao attachment. Ako se email aplikacija ne otvori automatski, otvorite je ručno i pošaljite na alegrokupovina@gmail.com.');
const mailto='mailto:alegrokupovina@gmail.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
window.location.href=mailto;
}
potvrdiXlsx.addEventListener('click',posaljiNarudzbinuEmailom);
emailSlanjeLink.addEventListener('click',function(event){event.preventDefault();posaljiNarudzbinuEmailom();});
prikazi();
</script>
</body>
</html>
